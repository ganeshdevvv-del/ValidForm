
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container">
    <h2 class="p-4">Form Validation</h2>

    <form id="myForm" novalidate>
        <div class="row">

            <div class="col-md-6 mb-3">
                <label for="name">Name*:</label>
                <input type="text" class="form-control" id="name">
                <small id="nameError"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label for="email">Email*:</label>
                <input type="email" class="form-control" id="email">
                <small id="emailError"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label for="password">Password*:</label>
                <input type="password" class="form-control" id="password">
                <small id="passwordError"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label for="conf-password">Confirm Password*:</label>
                <input type="password" class="form-control" id="conf-password">
                <small id="confPasswordError"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label for="phone">Phone Number:</label>
                <input type="tel" class="form-control" id="phone">
            </div>

            <div class="col-md-6 mb-3">
                <label for="age">Age*:</label>
                <input type="number" class="form-control" id="age">
                <small id="ageError"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label for="dob">Date of Birth:</label>
                <input type="date" class="form-control" id="dob">
            </div>

            <div class="col-md-6 mb-3">
                <label for="gender">Gender*:</label>
                <select class="form-select" id="gender">
                    <option value="">Select Gender</option>
                    <option value="male">Male</option>
                    <option value="female">Female</option>
                    <option value="other">Other</option>
                </select>
                <small id="genderError"></small>
            </div>

            <div class="col-md-6 mb-3">
                <label for="website">Website:</label>
                <input type="url" class="form-control" id="website">
            </div>

            <div class="col-md-6 mb-3">
                <label for="address">Address:</label>
                <textarea class="form-control" id="address"></textarea>
            </div>

            <div class="col-md-6 mb-3">
                <label for="experience">Experience:</label>
                <input type="number" class="form-control" id="experience">
            </div>

            <div class="col-md-6 mb-3">
                <label for="photo">Upload Photo:</label>
                <input type="file" class="form-control" id="photo">
            </div>

            <div class="col-12 mb-3">
                <input type="checkbox" id="terms">
                <label for="terms">I agree to the terms and conditions</label>
            </div>

            <div class="col-12">
                <p id="message"></p>
                <button type="submit" class="btn btn-primary">Submit</button>
            </div>

        </div>
    </form>
</div>

<script src="form.js"></script>
</body>
</html>
